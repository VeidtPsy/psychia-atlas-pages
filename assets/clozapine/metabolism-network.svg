<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 2090" class="metabolism-network" role="img" aria-labelledby="network-title network-desc">
<title id="network-title">氯氮平代谢反应总图</title>
<desc id="network-desc">14个化学结构共享同一张反应网络。母药居上方中央，连接N-氧化、N-脱甲基、N-结合及芳环与O-结合分支。箭头标明酶和证据来源，产物标明活性。虚线为合并路径，不表示确定单步或人体通量。</desc>
